name: CI

on:
  push:
  pull_request:

# Read-only. This workflow builds and tests; it publishes nothing and needs no write scope, and
# stating that here means the job's token cannot be used for more than it does regardless of what the
# repository's default permissions are set to.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs rather than to moving tags. A tag is a pointer its
# owner can move, so `@v4` means "whatever that repository decides v4 is on the day this runs" — and
# an action runs with access to this workflow's token. The trailing comment records which release each
# SHA was, because a bare hash is unreviewable.
#
# Every step below is one stage of tools/verify.sh, which is where the checks themselves live. They
# are here as separate steps rather than as one call so a failure names itself in the run summary and
# in the notification mail, and they are in that script rather than inline so the command a developer
# runs before pushing is the same command that runs here. Four of the eight failures in the week this
# was reorganised were a check that existed only in this file and so could not be run beforehand.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore
        run: bash tools/verify.sh restore

      - name: Build
        run: bash tools/verify.sh build

      - name: Test
        run: bash tools/verify.sh test

      - name: Test the dashboard client
        run: bash tools/verify.sh dashboard

      - name: Published evaluation figures must match what the code produces
        run: bash tools/verify.sh figures

      - name: Test the collection tooling
        run: bash tools/verify.sh tooling

      - name: Format
        run: bash tools/verify.sh format

      - name: Container build
        run: bash tools/verify.sh docker

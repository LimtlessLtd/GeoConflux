name: Publish dashboard to GitHub Pages

# GitHub Pages serves static files only, so the live ASP.NET Core backend cannot run there. This
# workflow instead executes the real pipeline against live public feeds and the committed collection
# bundles, exports what it produced as JSON, and publishes that alongside the dashboard. The
# published page is therefore genuine pipeline output rather than hand-written fixtures.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The snapshot records when it was generated and the dashboard shows that date, so a weekly
    # rebuild keeps the published run recent rather than visibly stale.
    - cron: '17 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish rather than cancelling it, so Pages is never left part-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted unless this repository says otherwise. The one thing a hosted runner cannot do is
    # run a language model: four cores, no GPU, and a fresh machine every time. Enrichment therefore
    # falls back to the deterministic stand-in here, which cannot translate, which is why the
    # published page labels foreign-language reports as untranslated (ADR 039, ADR 041).
    #
    # Setting the repository variable PIPELINE_RUNNER to a self-hosted label moves this job onto a
    # machine that has Ollama and a GPU, and AI_PROVIDER/AI_MODEL below then produce real
    # translations on the published page. Set them together: pointing the provider at Ollama on a
    # runner without it would fail every enrichment call and publish a page with no AI at all.
    runs-on: ${{ vars.PIPELINE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # Both are supplied so the job does not depend on one exact SDK build remaining
          # downloadable: global.json pins the version the repository was developed against, and the
          # feature-band wildcard provides a compatible SDK if that exact build is unavailable.
          dotnet-version: 10.0.x
          global-json-file: global.json

      # These four are stages of tools/verify.sh, the same script CI and a developer run. Publishing
      # has to build and test from the identical commands that gate a push, or the page could be
      # deployed by a path nobody had checked.
      - name: Restore
        run: bash tools/verify.sh restore

      - name: Build
        run: bash tools/verify.sh build

      # The dashboard is only worth publishing if the pipeline behind it actually works.
      - name: Test
        run: bash tools/verify.sh test

      # The dashboard client is JavaScript and is not part of the .NET solution, so it gets its own
      # step. See docs/adr/024-dashboard-test-runner.md.
      - name: Test the dashboard client
        run: bash tools/verify.sh dashboard

      - name: Assemble the static dashboard
        # The trailing "/." copies the directory CONTENTS. Without it, cp nests the source inside
        # dist whenever dist already exists, which would publish a site one directory too deep.
        run: |
          mkdir -p dist
          cp -r src/Geopolitics.Api/wwwroot/. dist/

      - name: Run the pipeline against live public feeds and export its output
        # The output path is absolute on purpose. "dotnet run" executes the program with the project
        # directory as its working directory, so a relative path here would silently write the
        # snapshot to src/Geopolitics.Workers/dist and publish a dashboard with no data in it.
        #
        # Feeds live here rather than in the application because no publisher is an architectural
        # dependency of this project: which sources to read is a deployment decision, and this
        # workflow is the deployment. All four are public, require no credential, and are consumed as
        # RSS is meant to be — a few dozen headlines per run, at most once a push plus a weekly cron.
        #
        # There is no floor under this. A recorded synthetic stream used to be left enabled so that
        # a day when every feed was unreachable still published something; that stream no longer
        # exists anywhere in the application (ADR 040), so a run that reads nothing real exports
        # nothing and fails the verification below. The previous page then stays live, which is the
        # correct outcome: a stale page that was true yesterday beats a fresh one padded with
        # invented records.
        env:
          Providers__Mode: Live
          Providers__Rss__Enabled: "true"
          Providers__Rss__MaxItemsPerPoll: "25"
          Providers__Rss__Feeds__0__Name: un-news
          Providers__Rss__Feeds__0__Url: https://news.un.org/feed/subscribe/en/news/all/rss.xml
          Providers__Rss__Feeds__1__Name: reliefweb
          Providers__Rss__Feeds__1__Url: https://reliefweb.int/updates/rss.xml
          Providers__Rss__Feeds__2__Name: bbc-world
          Providers__Rss__Feeds__2__Url: https://feeds.bbci.co.uk/news/world/rss.xml
          Providers__Rss__Feeds__3__Name: al-jazeera
          Providers__Rss__Feeds__3__Url: https://www.aljazeera.com/xml/rss/all.xml

          # Added 2026-09-14, and every one of them for the same measured reason: the published
          # snapshot was 95 English observations out of 99. A conflict is reported in the language it
          # happens in, so an English-only feed list finds what English publishes and calls the rest
          # quiet -- which is precisely the failure the coverage panel exists to make visible rather
          # than to commit. These six take the page from one language to five.
          #
          # Each was fetched once on 2026-09-14 and answered 200 with real items before being listed
          # here; Al Jazeera Arabic answered 301 and was dropped rather than have its redirect
          # guessed at. Adding a feed that serves nothing would be claiming reach this does not have.
          Providers__Rss__Feeds__4__Name: un-news-ar
          Providers__Rss__Feeds__4__Url: https://news.un.org/feed/subscribe/ar/news/all/rss.xml
          Providers__Rss__Feeds__5__Name: un-news-fr
          Providers__Rss__Feeds__5__Url: https://news.un.org/feed/subscribe/fr/news/all/rss.xml
          Providers__Rss__Feeds__6__Name: un-news-es
          Providers__Rss__Feeds__6__Url: https://news.un.org/feed/subscribe/es/news/all/rss.xml
          Providers__Rss__Feeds__7__Name: bbc-arabic
          Providers__Rss__Feeds__7__Url: https://feeds.bbci.co.uk/arabic/rss.xml

          # The Sahel is the region the global coverage assessment names as thinnest, and RFI is the
          # wire that covers it in the language most of it is reported in.
          Providers__Rss__Feeds__8__Name: rfi-afrique
          Providers__Rss__Feeds__8__Url: https://www.rfi.fr/fr/afrique/rss
          Providers__Rss__Feeds__9__Name: ukrinform
          Providers__Rss__Feeds__9__Url: https://www.ukrinform.net/rss/block-lastnews

          # ACLED and UCDP are the two sources that make coverage global rather than deep in a few
          # theatres: human-coded conflict events, with their own coordinates and their own stated
          # precision, for every populated continent. Both are credentialed, both are free to
          # request for research use, and neither credential is in this repository or ever will be.
          #
          # Each adapter enables itself only if its secret is actually set. That is belt and braces
          # -- the adapters already refuse to poll without a credential -- but it makes the log say
          # "not enabled" rather than leaving a reader to work out why a live provider is silent.
          # A fork with no secrets configured therefore builds and publishes exactly as before.
          #
          # Deliberately no Providers__*__BackfillSince here. The export runs against a throwaway
          # database, so the checkpoint that makes a backfill resumable is discarded with it, and a
          # walk configured here would re-read its first few windows on every push and never get
          # any further back. Backfill belongs to a deployment that keeps its database.
          Providers__Acled__Enabled: ${{ secrets.ACLED_PASSWORD != '' }}
          Providers__Acled__Username: ${{ secrets.ACLED_USERNAME }}
          Providers__Acled__Password: ${{ secrets.ACLED_PASSWORD }}
          Providers__Acled__MaxItemsPerPoll: "500"
          Providers__Acled__MaxRequestsPerPoll: "6"
          Providers__Ucdp__Enabled: ${{ secrets.UCDP_ACCESS_TOKEN != '' }}
          Providers__Ucdp__AccessToken: ${{ secrets.UCDP_ACCESS_TOKEN }}
          Providers__Ucdp__MaxItemsPerPoll: "500"
          Providers__Ucdp__MaxRequestsPerPoll: "6"

          # Mock unless this repository says otherwise, on the same principle as the credentials
          # above: a fork with nothing configured builds and publishes exactly as before. Set
          # AI_PROVIDER to Ollama on a self-hosted runner that has the daemon, or to OpenAI with
          # AI_API_KEY set, and the same pipeline starts translating.
          Ai__Provider: ${{ vars.AI_PROVIDER || 'Mock' }}
          Ai__Model: ${{ vars.AI_MODEL || 'qwen3.5:4b' }}
          Ai__ApiKey: ${{ secrets.AI_API_KEY }}
        run: >
          dotnet run --project src/Geopolitics.Workers --configuration Release --no-build
          --no-launch-profile -- --export "${{ github.workspace }}/dist/data"

      - name: Verify the exported snapshot
        env:
          # Read here as well as in the export step so the check below can say which sources were
          # actually available to the run, rather than inferring it from how much data came out.
          ACLED_ENABLED: ${{ secrets.ACLED_PASSWORD != '' }}
          UCDP_ENABLED: ${{ secrets.UCDP_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          for file in dist/index.html dist/app.js dist/styles.css \
                      dist/data/meta.json dist/data/incidents.json dist/data/observations.json \
                      dist/data/coverage.json \
                      dist/data/analytics/24h.json dist/data/analytics/7d.json \
                      dist/data/analytics/30d.json dist/data/analytics/90d.json \
                      dist/data/conflicts/30d.json; do
            test -s "$file" || { echo "::error::Missing or empty: $file"; exit 1; }
          done
          # app.js imports its logic from ./lib, so a module that failed to copy breaks the page
          # on load — and breaks it in a console nobody is watching. The list is read out of the
          # published app.js rather than repeated here, so it cannot drift from what the page asks
          # for. See docs/adr/024-dashboard-test-runner.md.
          modules=$(grep -oE "from './lib/[^']+'" dist/app.js | sed "s|from './||; s|'||" | sort -u)
          test -n "$modules" || { echo "::error::app.js imports no modules; the published file is not the one that was tested."; exit 1; }
          for module in $modules; do
            test -s "dist/$module" || { echo "::error::app.js imports $module, which is missing or empty in the published output."; exit 1; }
          done
          echo "Verified $(echo "$modules" | wc -l) dashboard module(s) reached the published output."

          # An empty run would publish a blank dashboard, which is worse than failing the build.
          incidents=$(jq '.incidentCount' dist/data/meta.json)
          observations=$(jq '.observationCount' dist/data/meta.json)
          live=$(jq '.liveObservationCount' dist/data/meta.json)
          demo=$(jq '.demoObservationCount' dist/data/meta.json)
          echo "Snapshot contains $incidents incident(s) from $observations observation(s): $live live, $demo demo."
          test "$incidents" -gt 0 || { echo "::error::The snapshot contains no incidents."; exit 1; }
          test "$observations" -gt 0 || { echo "::error::The snapshot contains no observations."; exit 1; }

          # Every observation must be real reporting. Nothing in the application can produce a
          # synthetic record any more, so a non-zero count here does not mean the page is padded --
          # it means something reintroduced a fabricated source, and that must fail rather than
          # publish (ADR 040).
          if [ "$demo" -ne 0 ]; then
            echo "::error::The snapshot carries $demo synthetic observation(s). This system publishes real reporting only."
            exit 1
          fi

          # Failing, not warning. With no recorded stream to fall back on, a run with no live
          # observations has nothing truthful to publish, and the checks above will already have
          # failed on the empty counts. This is the explicit statement of why.
          if [ "$live" -eq 0 ]; then
            echo "::error::No live observations were ingested, and there is no recorded stream to publish instead."
            exit 1
          fi

          # How many distinct regions this run actually placed something in. Reported, never
          # asserted: the number depends on which credentials this repository holds, and a threshold
          # would turn "nobody has requested an ACLED key yet" into a broken build. Echoing it means
          # turning a credential on shows as a step change in the log of the run that did it.
          regions=$(jq '[.byRegion[]?.category] | unique | length' dist/data/coverage.json)
          echo "Snapshot places observations in $regions distinct region(s)."

          # A statement of fact rather than a guess at a threshold. With neither dataset credential
          # configured, global coverage is whatever the news feeds happened to mention that morning,
          # and the page should not be read as more than that.
          if [ "$ACLED_ENABLED" != "true" ] && [ "$UCDP_ENABLED" != "true" ]; then
            echo "::notice::Neither ACLED nor UCDP is configured, so these $regions region(s) are whatever the news feeds happened to mention. Both credentials are free to request for research use; see docs/operations/dataset-credentials.md."
          fi

          # The label has to match the data. Publishing real reporting stamped as synthetic, or the
          # reverse, is the one failure here that would actively mislead a reader. Kept as a check
          # even though the counts above now guarantee the live case: the labelling is the safety
          # net, and a safety net that is only tested when it is needed is not a safety net.
          claimed_demo=$(jq '.isDemoData' dist/data/meta.json)
          if [ "$claimed_demo" != "false" ]; then
            echo "::error::The snapshot carries live observations but is labelled as demo data."
            exit 1
          fi
          # Pages runs Jekyll by default, which would drop any path beginning with an underscore.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
